# Files the Lite image leaves out. iso/scripts/build-in-container.sh adds
# these lines to the [options] of the pacman.conf buildiso installs with.
# Wincraft Setup reinstalls the packages concerned in the new system
# (/usr/lib/wincraft/restore-trimmed-files), so installed systems are
# complete. Nothing here is needed to boot the live desktop, get online
# over wired or Wi-Fi networks, or run Setup.

# Documentation, manuals and translations
NoExtract = usr/share/doc/* usr/share/gtk-doc/* usr/share/help/* usr/share/info/* usr/share/man/*
NoExtract = usr/share/locale/* !usr/share/locale/locale.alias

# Microcode copies for late loading; boot/intel-ucode.img stays
NoExtract = usr/lib/firmware/intel-ucode/* usr/lib/firmware/amd-ucode/*

# Bluetooth firmware
NoExtract = usr/lib/firmware/intel/ibt-* usr/lib/firmware/rtl_bt/* usr/lib/firmware/qca/* usr/lib/firmware/mediatek/BT_RAM_CODE_*

# Intel cameras, NPU, audio DSPs, QuickAssist and server Ethernet
NoExtract = usr/lib/firmware/intel/ipu* usr/lib/firmware/intel/vpu/* usr/lib/firmware/intel/vsc/* usr/lib/firmware/intel/avs/* usr/lib/firmware/intel/catpt/*
NoExtract = usr/lib/firmware/intel/dsp_fw* usr/lib/firmware/intel/fw_sst* usr/lib/firmware/intel/IntcSST* usr/lib/firmware/intel/ice/* usr/lib/firmware/qat_* usr/lib/firmware/intel/qat/*

# Wi-Fi chips of routers, access points, servers and ARM boards (laptop and
# desktop chips stay)
NoExtract = usr/lib/firmware/ath10k/QCA99* usr/lib/firmware/ath10k/QCA4019* usr/lib/firmware/ath10k/WCN3990*
NoExtract = usr/lib/firmware/ath11k/IPQ* usr/lib/firmware/ath11k/QCN9074* usr/lib/firmware/ath11k/WCN6750*
NoExtract = usr/lib/firmware/ath12k/IPQ* usr/lib/firmware/ath12k/QCN9274*
NoExtract = usr/lib/firmware/mediatek/mt7915* usr/lib/firmware/mediatek/mt7916* usr/lib/firmware/mediatek/mt798* usr/lib/firmware/mediatek/mt7996/*
NoExtract = usr/lib/firmware/mediatek/mt8* usr/lib/firmware/mediatek/sof*

# No kernel modules are left out: modules that the live initramfs includes
# (block devices, file systems such as CIFS) depend on seemingly unrelated
# ones (InfiniBand/RDMA), and a missing one fails the build.
