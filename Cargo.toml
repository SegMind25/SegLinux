[workspace]
resolver = "3"
members = [
    "crates/wincraft-pe",
    "crates/wincraft-core",
    "crates/wcrun",
    "crates/wincraft-setup",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Wincraft contributors"]
repository = "https://github.com/SegMind25/Wincraft"
homepage = "https://github.com/SegMind25/Wincraft"

[workspace.dependencies]
wincraft-pe = { path = "crates/wincraft-pe" }
wincraft-core = { path = "crates/wincraft-core" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ratatui = "0.30"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
