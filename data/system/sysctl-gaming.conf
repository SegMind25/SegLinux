# Wincraft gaming defaults.
#
# Only keys every x86-64 kernel Wincraft ships has: one failing key makes
# the whole sysctl service fail at boot. The NMI watchdog, which cannot be
# switched off on every machine (virtual machines answer error 524), is
# turned off on the kernel command line instead (nowatchdog nmi_watchdog=0,
# written by Wincraft Setup).

# Some Windows games map a very large number of memory areas and crash with
# the kernel default of 65530. This is the value SteamOS uses.
vm.max_map_count = 2147483642

# Split lock detection deliberately slows down programs that perform split
# locks; several games do, and stutter badly. SteamOS turns it off too.
kernel.split_lock_mitigate = 0

# Game launchers and Steam watch many files.
fs.inotify.max_user_watches = 524288
