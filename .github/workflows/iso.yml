name: ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition (lite is OpenRC only)
        type: choice
        options: [full, lite]
        default: full
      init:
        description: Init system
        type: choice
        options: [openrc, runit, dinit]
        default: openrc
      kernel:
        description: Kernel
        type: choice
        options: [linux-zen, linux, linux-lts]
        default: linux-zen
      release:
        description: Publish the ISO as a GitHub release
        type: boolean
        default: true
  # Version tags (both editions), and any push to main whose commit message
  # contains "[build iso]" (full edition) and/or "[build lite iso]" (Lite).
  push:
    tags: ["v*"]
    branches: [main]

permissions:
  contents: write

jobs:
  iso:
    name: Build the SegLinux ISO (${{ matrix.edition }}, ${{ matrix.edition == 'lite' && 'openrc' || inputs.init || 'openrc' }}, ${{ inputs.kernel || 'linux-zen' }})
    if: >-
      github.event_name != 'push' || github.ref_type == 'tag' ||
      contains(github.event.head_commit.message, '[build iso]') ||
      contains(github.event.head_commit.message, '[build lite iso]')
    runs-on: ubuntu-latest
    # A full build takes about an hour; a hang should not burn four.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.edition) || github.ref_type == 'tag' && '["full","lite"]' || contains(github.event.head_commit.message, '[build lite iso]') && (contains(github.event.head_commit.message, '[build iso]') && '["full","lite"]' || '["lite"]') || '["full"]') }}
    env:
      EDITION: ${{ matrix.edition }}
      # The Lite edition is OpenRC only.
      INIT: ${{ matrix.edition == 'lite' && 'openrc' || inputs.init || 'openrc' }}
      KERNEL: ${{ inputs.kernel || 'linux-zen' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The seglinux package's version counts the commits (0.1.0.<count>),
          # so every update is newer than the one before.
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af > /dev/null
          df -h /
      - name: Load the loop module
        run: sudo modprobe loop
      # The public half of the key SegLinux's updates are signed with goes
      # into the image's seglinux package, so installed systems trust the
      # updates (published by the "SegLinux update" workflow, update.yml).
      - name: Prepare the update signing key
        env:
          SEGLINUX_SIGNING_KEY: ${{ secrets.SEGLINUX_SIGNING_KEY }}
        run: iso/scripts/signing-key.sh
      - name: Build
        run: |
          edition=()
          [[ $EDITION == lite ]] && edition=(--lite)
          SEGLINUX_PKGVER="0.1.0.$(git rev-list --count HEAD)" \
            ./iso/build.sh "${edition[@]}" -e docker -i "$INIT" -k "$KERNEL"
      - name: Show the result
        run: ls -l iso/out/ iso/out/packages/ && cat iso/out/*.sha256
      # Workflow artifacts would exceed the Actions storage quota of private
      # repositories, so the ISO is published as a release. Release assets
      # are limited to 2 GiB each: larger images are split into parts.
      - name: Publish as a release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd iso/out
          iso=$(ls seglinux-*.iso)
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            tag=$GITHUB_REF_NAME
          else
            tag="iso-$(date -u +%Y%m%d)-$EDITION-$INIT-$KERNEL-run$GITHUB_RUN_NUMBER"
          fi
          title="SegLinux $tag"
          [[ $EDITION == lite ]] && title="SegLinux Lite $tag"
          size=$(stat -c %s "$iso")
          assets=("$iso.sha256")
          if (( size > 2000000000 )); then
            split -b 1900M -d -a 2 "$iso" "$iso.part"
            rm "$iso"
            assets+=("$iso".part*)
            get="cat $iso.part* > $iso"
          else
            assets+=("$iso")
            get="(single file)"
          fi
          cat > notes.md <<EOF
          SegLinux live/installer ISO, $EDITION edition, built from $GITHUB_SHA ($INIT, $KERNEL).
          Size: $(numfmt --to=iec --suffix=B "$size") ($size bytes).

          Download every asset, then:

          \`\`\`sh
          $get
          sha256sum -c $iso.sha256
          \`\`\`

          Write it to a USB stick with \`sudo dd if=$iso of=/dev/sdX bs=4M status=progress oflag=sync\`
          (or Ventoy), disable Secure Boot and boot from it. See docs/building.md.
          EOF
          # A version tag builds both editions into one release.
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$title" --notes-file notes.md --prerelease ||
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
      # The website (Vercel) lists the releases when it is built: ask it to
      # build again. Add the project's deploy hook URL as the repository
      # secret VERCEL_DEPLOY_HOOK (see README, "Website").
      - name: Update the website
        if: github.event_name == 'push' || inputs.release
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [[ -z $VERCEL_DEPLOY_HOOK ]]; then
            echo "No VERCEL_DEPLOY_HOOK secret: the website shows the new image after its next deployment."
          else
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
            echo "Website deployment requested."
          fi
