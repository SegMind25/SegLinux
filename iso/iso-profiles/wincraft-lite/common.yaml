---
# Shared packages for the Lite edition. iso/scripts/build-in-container.sh
# copies this file over iso-profiles/common/common.yaml when it builds
# wincraft-lite: only what the live system and a first boot need. Firmware
# is limited to common GPUs and network chips (Arch's split linux-firmware
# packages); Setup downloads the rest (online-packages).

packages-base:
  - base
  - linux
  - linux-firmware-amdgpu
  - linux-firmware-intel
  - linux-firmware-radeon
  - linux-firmware-realtek
  - linux-firmware-atheros
  - linux-firmware-mediatek
  - linux-firmware-broadcom
  - intel-ucode
  - amd-ucode
  - mkinitcpio
  # buildiso copies its memtest.bin into the ISO's boot menu.
  - memtest86+
  - grub
  - efibootmgr
  - os-prober
  - dosfstools
  - e2fsprogs
  - btrfs-progs
  - xfsprogs
  - ntfs-3g
  - sudo
  - nano
  - which
  - wireless-regdb
  - wpa_supplicant
  - lsb-release

packages-apps: []

# artools installs these when the profile has a live layer.
packages-xorg:
  - xorg-xwayland

packages-xlibre:
  - xorg-xwayland

packages-misc:
  - ttf-dejavu
  - xdg-user-dirs
  - xdg-utils

packages-init:
  openrc:
    - elogind-openrc
    - dbus-openrc

packages-boot:
  - iso-initcpio
