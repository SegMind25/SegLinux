# SegLinux: steady Wi-Fi speed. Laptop Wi-Fi cards save power by sleeping
# between packets; the speed and the ping then jump around, and Realtek
# cards also drop the connection. These keep the radio awake (a little
# more battery). Options for a card that is not in the computer are unused.

# Intel (iwlwifi): the "active" power scheme instead of "balanced".
options iwlmvm power_scheme=1
# Realtek RTL8821CE, RTL8822BE/CE, RTL8723DE (rtw88): no deep sleep, no
# PCIe link power saving (the usual cause of slow speeds and drops).
options rtw88_core disable_lps_deep=y
options rtw88_pci disable_aspm=y
# Realtek RTL8852AE/BE/CE (rtw89): the same.
options rtw89_core disable_ps_mode=y
options rtw89_pci disable_aspm_l1=y disable_aspm_l1ss=y disable_clkreq=y
# MediaTek MT7921/MT7922 (mt7921e): no PCIe link power saving.
options mt7921e disable_aspm=y
# Older Realtek cards (rtlwifi: RTL8723BE in many HP and Lenovo laptops,
# RTL8723AE, RTL8188EE, RTL8192EE, RTL8821AE): no firmware or idle power
# saving. (RTL8723BE with one antenna: ant_sel=1 or 2 can raise the
# signal; see docs/desktop.md.)
options rtl8723be fwlps=0 ips=0
options rtl8723ae fwlps=0 ips=0
options rtl8188ee fwlps=0 ips=0
options rtl8192ee fwlps=0 ips=0
options rtl8821ae fwlps=0 ips=0
