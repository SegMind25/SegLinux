#
# pacman configuration buildiso uses to install the ISO's root filesystems
# (artools: ~/.config/artools/pacman.conf.d/iso-x86_64.conf).
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm
# Builds run inside containers, where pacman's download sandbox may not be
# available.
DisableSandboxFilesystem
DisableSandboxSyscalls
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Packages built from this repository (seglinux) by
# iso/scripts/build-in-container.sh. Listed first so it takes precedence.
[seglinux]
SigLevel = Optional TrustAll
Server = file:///var/lib/seglinux-repo

[system]
Include = /etc/pacman.d/mirrorlist

[world]
Include = /etc/pacman.d/mirrorlist

[galaxy]
Include = /etc/pacman.d/mirrorlist

# 32-bit libraries: Steam and 32-bit Vulkan/OpenGL drivers for games.
[lib32]
Include = /etc/pacman.d/mirrorlist

# Brave (brave-bin), which Artix and Arch do not package; set up by
# iso/scripts/chaotic-aur.sh. Last, so Artix's own packages come first.
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
