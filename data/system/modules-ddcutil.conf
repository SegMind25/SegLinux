# Replaces ddcutil's /usr/lib/modules-load.d/ddcutil.conf, which names the
# same module as i2c-tools' i2c-tools.conf (a dependency of ddcutil): OpenRC
# would load i2c-dev twice and report "Module already in kernel" at boot.
# i2c-dev is still loaded, once, by /usr/lib/modules-load.d/i2c-tools.conf.
