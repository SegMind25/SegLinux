[workspace]
resolver = "3"
members = [
    "crates/seglinux-pe",
    "crates/seglinux-core",
    "crates/segrun",
    "crates/seglinux-setup",
    "crates/seglinux-shell",
    "crates/seglinux-installer",
    "crates/seglinux-greeter",
    "crates/seglinux-compositor",
]
# seg has its own workspace and release profile (tools/seg/Cargo.toml).
exclude = ["tools/seg"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["SegLinux contributors"]
repository = "https://github.com/SegMind25/SegLinux"
homepage = "https://github.com/SegMind25/SegLinux"

[workspace.dependencies]
seglinux-pe = { path = "crates/seglinux-pe" }
seglinux-core = { path = "crates/seglinux-core" }
# The graphical installer only needs the library, not the text-mode wizard.
seglinux-setup = { path = "crates/seglinux-setup", default-features = false }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ratatui = "0.30"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
