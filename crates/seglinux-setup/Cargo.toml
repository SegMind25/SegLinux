[package]
name = "seglinux-setup"
description = "SegLinux Setup: the installer, modelled on Windows Setup and its answer files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["tui"]
# The interactive text-mode installer. Without it only unattended
# installation and dry runs are available.
tui = ["dep:ratatui"]

[dependencies]
seglinux-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ratatui = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
