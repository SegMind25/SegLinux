---
# SegLinux Lite: the smallest SegLinux image (about 740 MB).
#
# The live system has the Rust desktop on labwc, the foot terminal and
# SegLinux Setup. Setup downloads everything else the full edition ships
# (Wine, Steam, Firefox, drivers, ...) during installation, listed in
# /usr/share/seglinux/online-packages, which the build generates from the
# full profile. Installing therefore needs an internet connection.
#
# common.yaml next to this file replaces the shared one for this profile.
# OpenRC only: without a display manager, the live user is signed in on
# tty1 by OpenRC's agetty (live-overlay/etc/conf.d/agetty.tty1) and
# ~/.bash_profile starts the desktop.

live-session:
  user: seglinux
  password: seglinux
  autologin: true
  use-xlibre: false
  services:
    - NetworkManager

rootfs:
  packages:
    - seglinux
    # The seglinux package brings the boot menu theme; buildiso-hooks.sh
    # puts it on the image in place of Artix's.
    - labwc
    - gtk4
    - gtk4-layer-shell
    - foot
    - mesa
    - adwaita-icon-theme           # icons and cursors for the GTK shell
    - networkmanager
    - polkit                       # lets the live user manage connections (nmtui)
  packages-init:
    openrc:
      - networkmanager-openrc

livefs:
  packages:
    - artix-grub-live
    # unsquashfs: seglinux-setup applies rootfs.img with it.
    - squashfs-tools
  packages-init:
    openrc:
      - artix-live-openrc
      # artix-live's pacman-init service needs haveged.
      - haveged-openrc
