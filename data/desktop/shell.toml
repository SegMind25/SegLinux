# Copy to ~/.config/seglinux/shell.toml to customize the Rust desktop.
wallpaper = "/usr/share/backgrounds/seglinux/seglinux-dark.jpg"
# %x is the date in your language's format.
clock_format = "%x  %H:%M"
# Dock launchers: desktop file ids (see /usr/share/applications), without
# ".desktop". Ones that are not installed are left out.
pinned = ["org.kde.dolphin", "firefox", "seglinux-terminal", "steam", "net.lutris.Lutris"]
# Files and folders in ~/Desktop as icons on the desktop.
desktop_icons = true

# Shell appearance (does not change other applications' themes).
theme = "dark"                  # dark or light
accent = "#3daee9"               # six-digit hex color
font_size = 13                   # 10..24 pixels
animations = true
wallpaper_fit = "cover"          # cover, contain or fill
dock_position = "bottom"         # bottom or top
dock_icon_size = 26              # 20..64 pixels
desktop_icon_size = 48           # 24..96 pixels
