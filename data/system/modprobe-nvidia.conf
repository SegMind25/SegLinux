# NVIDIA's DRM driver: kernel mode setting (needed by Wayland compositors and
# for a proper VT switch) and the framebuffer console on top of it. Without
# the nvidia driver installed this file does nothing.
options nvidia_drm modeset=1 fbdev=1
# Page Attribute Table instead of MTRRs for the driver's memory mappings:
# faster CPU-to-GPU transfers, the default NVIDIA has planned to switch to.
options nvidia NVreg_UsePageAttributeTable=1
