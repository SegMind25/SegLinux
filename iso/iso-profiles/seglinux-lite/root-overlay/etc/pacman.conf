#
# /etc/pacman.conf - SegLinux
#
# See the pacman.conf(5) manpage for option and repository directives.
#
[options]
#RootDir     = /
#DBPath      = /var/lib/pacman/
#CacheDir    = /var/cache/pacman/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
Architecture = auto

#IgnorePkg   =
#IgnoreGroup =
#NoUpgrade   =
#NoExtract   =

Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# NOTE: You must run `pacman-key --init` before first using pacman; the local
# keyring can then be populated with the keys of all official Artix Linux
# packagers with `pacman-key --populate artix`.

# SegLinux packages. Until a public binary repository is published, the
# seglinux package is installed from the ISO; build updates from the source
# repository with `make -C packaging/seglinux package`.
#[seglinux]
#SigLevel = Optional TrustAll
#Server = https://example.invalid/seglinux/$arch

[system]
Include = /etc/pacman.d/mirrorlist

[world]
Include = /etc/pacman.d/mirrorlist

[galaxy]
Include = /etc/pacman.d/mirrorlist

# 32-bit libraries for Steam, Wine and games.
[lib32]
Include = /etc/pacman.d/mirrorlist

# Brave (brave-bin) and its updates: Chaotic-AUR's prebuilt, signed AUR
# packages (https://aur.chaotic.cx). Last, so Artix's packages come first.
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
