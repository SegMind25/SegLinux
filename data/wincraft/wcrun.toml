# System-wide defaults for wcrun, the Windows program launcher.
# Copy to ~/.config/wincraft/wcrun.toml to change them for one user.
# `wcrun config` shows the settings in effect.

[defaults]
# wine | wine:/path/to/wine | proton:/path/to/Proton | umu | umu:/path/to/proton
runner = "wine"
# The shared Windows environment ("C: drive") every program installs into.
prefix = "default"
# Give each installer its own environment instead.
isolate_installers = false
# Direct3D 9/10/11 and 12 over Vulkan: auto | always | never
dxvk = "auto"
vkd3d = "auto"
esync = true
fsync = true
debug = false
hud = false

# Environment for every Windows program.
[env]

# Per-program settings, matched on the file name:
#
# [[app]]
# match = "Photoshop*.exe"
# prefix = "adobe"
# dxvk = "never"
# virtual_desktop = "1920x1080"
# dll_overrides = ["d3dcompiler_47=n,b"]
# env = { MESA_GL_VERSION_OVERRIDE = "4.6" }
