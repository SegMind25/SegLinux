name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install desktop build libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-4-dev libwayland-dev meson ninja-build xvfb xauth dbus-x11
          git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell --prefix=/usr -Dintrospection=false -Dvapi=false -Dsmoke-tests=false
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked -p seglinux-setup --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Rust Settings save integration
        env:
          GTK_A11Y: none
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          settings_test_dir=$(mktemp -d)
          XDG_CONFIG_HOME="$settings_test_dir" SEGLINUX_SETTINGS_TEST_ROOT="$settings_test_dir" \
            xvfb-run -a dbus-run-session -- cargo test --locked -p seglinux-shell \
              settings_apply_validates_and_preserves_game_overrides -- --ignored --test-threads=1
      - name: Rust Start menu and pins integration
        env:
          GTK_A11Y: none
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          start_test_dir=$(mktemp -d)
          XDG_CONFIG_HOME="$start_test_dir/config" XDG_DATA_HOME="$start_test_dir/data" \
            XDG_STATE_HOME="$start_test_dir/state" SEGLINUX_SETTINGS_TEST_ROOT="$start_test_dir" \
            xvfb-run -a dbus-run-session -- cargo test --locked -p seglinux-shell \
              start_menu_favorites_categories_search_and_new_applications -- --ignored --test-threads=1
      - name: Validate the example answer file
        run: cargo run --locked -q -p seglinux-setup -- validate crates/seglinux-setup/autounattend.example.toml
      - name: Validate the default segrun configuration
        run: cargo run --locked -q -p segrun -- --config data/seglinux/segrun.toml config

  scripts:
    name: Shell scripts and profile files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -s bash iso/build.sh iso/scripts/*.sh packaging/seglinux/seglinux.install data/system/seglinux-update
          shellcheck -s sh data/system/apply-branding data/system/pipewire-session \
            iso/iso-profiles/seglinux/live-overlay/usr/lib/seglinux/live-autostart \
            data/desktop/seglinux-session data/desktop/seglinux-gaming-session \
            data/desktop/labwc/autostart data/system/seglinux-terminal data/system/restore-trimmed-files \
            data/system/profile-gaming.sh data/greeter/seglinux-greeter-session
          shellcheck -s bash iso/iso-profiles/seglinux-lite/live-overlay/etc/skel/.bash_profile
      - name: YAML, JSON and XML syntax
        run: |
          python3 -c 'import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' \
            iso/iso-profiles/common/common.yaml iso/iso-profiles/*/profile.yaml \
            iso/iso-profiles/seglinux-lite/common.yaml
          python3 -m json.tool data/plasma/look-and-feel/org.seglinux.desktop/metadata.json > /dev/null
          python3 -c 'import sys, xml.dom.minidom as m; [m.parse(f) for f in sys.argv[1:]]' data/desktop/labwc/rc.xml \
            data/greeter/labwc/rc.xml data/greeter/labwc/menu.xml
      - name: Overlay links resolve
        run: |
          broken=$(find iso/iso-profiles -xtype l)
          if [[ -n $broken ]]; then echo "Broken links:"; echo "$broken"; exit 1; fi
      - name: Website assembles
        run: |
          node --check site/app.js
          node --check site/preferences.js
          # The same dependencies as the Vercel build (vercel.json).
          python3 -m pip install --quiet --target /tmp/site-deps -r site/build-requirements.txt
          echo '[]' > /tmp/releases.json
          PYTHONPATH=/tmp/site-deps python3 site/build.py --out /tmp/site --releases /tmp/releases.json
          test -s /tmp/site/index.html && test -s /tmp/site/assets/logo.svg && test -s /tmp/site/docs/gaming.html
          python3 site/tests/test_download.py
      - name: Website behaviour in a browser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --silent --no-save --prefix /tmp/playwright playwright@1.56.1
          cp site/tests/releases.json /tmp/site/releases.json
          SITE_DIR=/tmp/site CHROMIUM_PATH="$(command -v google-chrome)" NODE_PATH=/tmp/playwright/node_modules \
            node site/tests/browser.cjs
      - name: Boot menu theme files exist
        run: |
          cd data/grub/seglinux
          # Every image the theme names (globs such as select_*.png must match).
          for f in $(grep -o '"[^"]*\.\(png\|jpg\)"' theme.txt | tr -d '"'); do
            compgen -G "$f" > /dev/null || { echo "missing: $f"; exit 1; }
          done
          ls *.pf2 icons/seglinux.png > /dev/null
      - name: Desktop entries
        run: |
          sudo apt-get install -y -qq desktop-file-utils > /dev/null
          desktop-file-validate data/applications/*.desktop data/desktop/*.desktop \
            iso/iso-profiles/seglinux/live-overlay/usr/share/applications/*.desktop

  packages:
    name: Artix package names (${{ matrix.profile }}, ${{ matrix.init }}, linux-zen)
    runs-on: ubuntu-latest
    container: docker.io/artixlinux/artixlinux:base
    strategy:
      fail-fast: false
      matrix:
        profile: [seglinux]
        init: [openrc, runit, dinit]
        include:
          # The Lite edition is OpenRC only.
          - profile: seglinux-lite
            init: openrc
    steps:
      - uses: actions/checkout@v4
      - name: Install pacman tooling
        run: |
          pacman-key --init
          pacman-key --populate artix
          pacman -Sy --noconfirm --needed go-yq
          iso/scripts/chaotic-aur.sh
      - run: iso/scripts/check-packages.sh -p ${{ matrix.profile }} -i ${{ matrix.init }} -k linux-zen
      - name: Packages the Lite edition downloads during Setup
        if: matrix.profile == 'seglinux-lite'
        run: iso/scripts/online-packages.sh -i openrc -k linux-zen
