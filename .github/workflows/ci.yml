name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install desktop build libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-4-dev libwayland-dev meson ninja-build
          git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell --prefix=/usr -Dintrospection=false -Dvapi=false -Dsmoke-tests=false
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked -p wincraft-setup --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Validate the example answer file
        run: cargo run --locked -q -p wincraft-setup -- validate crates/wincraft-setup/autounattend.example.toml
      - name: Validate the default wcrun configuration
        run: cargo run --locked -q -p wcrun -- --config data/wincraft/wcrun.toml config

  scripts:
    name: Shell scripts and profile files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -s bash iso/build.sh iso/scripts/*.sh packaging/wincraft/wincraft.install
          shellcheck -s sh data/system/apply-branding data/system/pipewire-session \
            iso/iso-profiles/wincraft/live-overlay/usr/lib/wincraft/live-autostart \
            data/desktop/wincraft-session data/desktop/wincraft-gaming-session \
            data/desktop/labwc/autostart data/system/wincraft-terminal
          shellcheck -s bash iso/iso-profiles/wincraft-lite/live-overlay/etc/skel/.bash_profile
      - name: YAML, JSON and XML syntax
        run: |
          python3 -c 'import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' \
            iso/iso-profiles/common/common.yaml iso/iso-profiles/*/profile.yaml \
            iso/iso-profiles/wincraft-lite/common.yaml
          python3 -m json.tool data/plasma/look-and-feel/org.wincraft.desktop/metadata.json > /dev/null
          python3 -c 'import sys, xml.dom.minidom as m; [m.parse(f) for f in sys.argv[1:]]' data/desktop/labwc/rc.xml
      - name: Desktop entries
        run: |
          sudo apt-get install -y -qq desktop-file-utils > /dev/null
          desktop-file-validate data/applications/*.desktop data/desktop/*.desktop \
            iso/iso-profiles/wincraft/live-overlay/usr/share/applications/*.desktop

  packages:
    name: Artix package names (${{ matrix.profile }}, ${{ matrix.init }}, linux-zen)
    runs-on: ubuntu-latest
    container: docker.io/artixlinux/artixlinux:base
    strategy:
      fail-fast: false
      matrix:
        profile: [wincraft]
        init: [openrc, runit, dinit]
        include:
          # The Lite edition is OpenRC only.
          - profile: wincraft-lite
            init: openrc
    steps:
      - uses: actions/checkout@v4
      - name: Install pacman tooling
        run: |
          pacman-key --init
          pacman-key --populate artix
          pacman -Sy --noconfirm --needed go-yq
      - run: iso/scripts/check-packages.sh -p ${{ matrix.profile }} -i ${{ matrix.init }} -k linux-zen
      - name: Packages the Lite edition downloads during Setup
        if: matrix.profile == 'wincraft-lite'
        run: iso/scripts/online-packages.sh -i openrc -k linux-zen
