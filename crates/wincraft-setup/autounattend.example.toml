# Wincraft answer file: the counterpart of Windows' autounattend.xml.
#
# Put it at the root of the install USB stick (next to LiveOS/), on any
# other USB drive, or pass `wincraft.unattend=/path/to/file` on the kernel
# command line. Wincraft Setup then answers every question from this file.
#
#   wincraft-setup validate autounattend.toml   # check it
#   wincraft-setup plan --unattend autounattend.toml   # show what it would do

[setup]
# Start installing as soon as the live session finds this file.
auto_start = false
# reboot | poweroff | none
finish = "reboot"

# windowsPE pass: DiskConfiguration. The whole disk is erased and laid out
# as GPT: EFI system partition, BIOS boot partition, optional swap, root.
[disk]
device = "/dev/sda"          # or "auto": the largest internal disk
wipe = true                  # required, like <WillWipeDisk>true</WillWipeDisk>
filesystem = "ext4"          # ext4 | btrfs | xfs
swap = "auto"                # "auto", "none" or a size such as "8GiB"
esp_size = "512MiB"

# windowsPE pass: ImageInstall. "auto" finds LiveOS/rootfs.img on the media.
[image]
source = "auto"

# offlineServicing: files copied over the new system ($OEM$) and packages
# installed offline. "auto" uses wincraft/oem and wincraft/packages on the media.
[oem]
path = "auto"
packages = "auto"

# specialize pass: International-Core.
[region]
locale = "en_US.UTF-8"
keyboard = "us"
timezone = "Europe/Paris"
hardware_clock = "utc"       # "local" if you dual-boot Windows

[computer]
name = "auto"                # "auto" gives a Windows-style DESKTOP-XXXXXXX

# oobeSystem pass: UserAccounts.
[[users]]
name = "alice"
full_name = "Alice Liddell"
# Password "wincraft" - generate your own with: openssl passwd -6
password_hash = "$6$wincraftexample$v3LK7L4kFhowFgY1fqUH5LiYrttOYwuGk3uEjfcKmOHskismxqE9f3FuEehJQH8zWYE4lisga.PoXxIpptIoX."
admin = true                 # member of wheel: can use sudo
autologin = false
groups = ["gamemode"]        # extra groups (missing ones are skipped)

# The root account stays locked unless a password is given.
[root]

[bootloader]
id = "Wincraft"              # UEFI boot entry name
removable = true             # also write \EFI\BOOT\BOOTX64.EFI
os_prober = true             # list Windows in the boot menu

# Services on top of Wincraft's defaults (NetworkManager, sddm, cups, ...).
[services]
enable = ["sshd"]
disable = []

# RunSynchronous / SetupComplete.cmd: commands run inside the new system.
[[run]]
pass = "specialize"
description = "Run Windows programs with umu-launcher (Proton) by default"
command = "mkdir -p /etc/skel/.config/wincraft && printf '[defaults]\\nrunner = \"umu\"\\n' > /etc/skel/.config/wincraft/wcrun.toml"

[[run]]
pass = "setup-complete"
command = "echo 'Installed by Wincraft Setup' > /etc/motd"
