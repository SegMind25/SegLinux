# SegLinux network defaults: steady speed and low latency, for games,
# streaming and downloads, on fast and slow connections alike.

# BBR finds the connection's real speed instead of filling buffers until
# packets drop (bufferbloat: lag spikes while something downloads). fq
# paces the packets, as BBR wants. Both modules load at boot
# (modules-load.d/seglinux-network.conf).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Reconnecting to a server sends data with the first packet.
net.ipv4.tcp_fastopen = 3
# A connection idle for a moment (a game between rounds, a paused video)
# keeps its speed instead of starting slowly again.
net.ipv4.tcp_slow_start_after_idle = 0
# Find a working packet size when a router drops large packets silently,
# instead of hanging connections.
net.ipv4.tcp_mtu_probing = 1
# Room for bursts of incoming packets on fast links.
net.core.netdev_max_backlog = 4096
