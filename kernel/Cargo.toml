[package]
name = "segkernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "segkernel"
test = false
bench = false

[features]
# Run the in-kernel test suite instead of idling, then exit QEMU.
ktest = []

# No third-party crates: everything the kernel runs is in this repository.
[dependencies]
bootinfo = { path = "../bootinfo" }
