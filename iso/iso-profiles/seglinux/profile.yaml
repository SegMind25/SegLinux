---
# SegLinux ISO profile for artools' buildiso (artools >= 0.39).
#
#   rootfs  -> LiveOS/rootfs.img  the system seglinux-setup installs; the
#                                 counterpart of sources\install.wim
#   livefs  -> LiveOS/livefs.img  live-session-only layer on top of rootfs;
#                                 together they are the counterpart of the
#                                 WinPE image in sources\boot.wim
#
# root-overlay/ is copied over rootfs, live-overlay/ over livefs.
# Build with iso/build.sh (see docs/building.md). The build swaps the kernel
# in common.yaml for linux-zen unless -k linux is given.

live-session:
  user: seglinux
  password: seglinux
  autologin: true
  # false selects packages-xorg from common.yaml (X11 + XWayland under
  # Plasma's Wayland session).
  use-xlibre: false
  services:
    - acpid
    - bluetoothd
    - cronie
    - cupsd
    - syslog-ng
    - NetworkManager
    - greetd
    - power-profiles-daemon
  # No init-specific user services: both desktop sessions start PipeWire
  # themselves (/usr/lib/seglinux/pipewire-session), so the same profile
  # works with OpenRC, runit and dinit.

rootfs:
  packages:
    # SegLinux itself: segrun, seglinux-setup, the Windows-style defaults.
    # Built from this repository into a local [seglinux] repository.
    - seglinux
    # The seglinux package brings the boot menu theme; buildiso-hooks.sh
    # puts it on the image in place of Artix's.

    # Chaotic-AUR's key and mirrors: Brave and its updates come from there
    # (see iso/scripts/chaotic-aur.sh).
    - chaotic-keyring
    - chaotic-mirrorlist

    # SegLinux's Rust shell uses labwc for Wayland window management.
    - labwc
    - gtk4
    - gtk4-layer-shell
    - polkit-gnome
    - swaylock
    - pavucontrol
    - network-manager-applet
    - wdisplays
    - xdg-desktop-portal-wlr
    - xdg-desktop-portal-gtk
    - grim                         # screenshots (Print, Win+Shift+S)
    - slurp

    # Plasma remains available as a fallback session during shell development.
    - plasma-desktop               # desktop, taskbar, Start menu
    - plasma-nm                    # network flyout
    - plasma-pa                    # volume flyout
    - plasma-systemmonitor         # Task Manager
    - powerdevil                   # power options
    - bluedevil                    # Bluetooth settings
    - kscreen                      # display settings
    - kinfocenter                  # System Information
    - kde-gtk-config
    - breeze-gtk
    - kwallet-pam                  # Credential Manager
    - xdg-desktop-portal-kde
    - greetd                       # sign-in service; SegLinux's sign-in screen
                                   # (seglinux-greeter) runs in it
    - print-manager                # Devices and Printers
    - discover                     # Microsoft Store
    - flatpak
    - xorg-server
    - xorg-xwayland
    - xdg-user-dirs
    - xdg-utils

    # Accessories
    - dolphin                      # File Explorer
    - kitty                        # Terminal
    - kate                         # Notepad
    - kcalc                        # Calculator
    - spectacle                    # Snipping Tool
    - gwenview                     # Photos
    - okular                       # PDF reader
    - ark                          # compressed folders
    - partitionmanager             # Disk Management
    - kio-extras                   # Network (smb://) and thumbnails
    - kio-admin                    # open folders as administrator
    - kdenetwork-filesharing       # share folders with Windows PCs
    - ffmpegthumbs
    - kdegraphics-thumbnailers
    - brave-bin                    # Edge: Brave, the default browser (Chaotic-AUR)
    - vlc                          # Media Player

    # Sound
    - pipewire
    - pipewire-alsa
    - pipewire-pulse
    - wireplumber
    - alsa-utils

    # Networking, printing and Windows file sharing
    - networkmanager
    - bluez
    - bluez-utils
    - cups
    - smbclient
    - cifs-utils
    - ntp
    - openssh

    # Fonts metric-compatible with Windows fonts (Arial, Times New Roman,
    # Courier New, Calibri) so documents keep their layout
    - noto-fonts
    - noto-fonts-emoji
    - ttf-liberation
    - ttf-carlito

    # Running Windows programs and games
    - wine
    - winetricks
    - steam                        # Steam and Proton
    - lutris                       # GOG, Epic, Battle.net and other launchers
    - gamemode                     # CPU/GPU tuning while a game runs
    - lib32-gamemode
    - mangohud                     # FPS and frame-time overlay (64-bit games)
    - gamescope                    # gaming compositor, Gaming Mode session
    - dosbox
    - mesa
    - lib32-mesa
    - vulkan-icd-loader
    - lib32-vulkan-icd-loader
    - vulkan-radeon
    - lib32-vulkan-radeon
    - vulkan-intel                 # Intel: ANV (Skylake+), HASVK (Ivy Bridge-Broadwell)
    - lib32-vulkan-intel
    - intel-media-driver           # hardware video decoding (Broadwell+), less CPU load
    - libva-intel-driver           # hardware video decoding on older Intel GPUs
    - vulkan-nouveau
    - vulkan-tools
    - lib32-pipewire               # sound for 32-bit games

  packages-init:
    openrc:
      - networkmanager-openrc
      - greetd-openrc
      - cups-openrc
      - bluez-openrc
      - syslog-ng-openrc
    runit:
      - networkmanager-runit
      - greetd-runit
      - cups-runit
      - bluez-runit
      - syslog-ng-runit
    dinit:
      - networkmanager-dinit
      - greetd-dinit
      - cups-dinit
      - bluez-dinit
      - syslog-ng-dinit

livefs:
  packages:
    # Live boot menu scaffolding buildiso reads from this layer.
    - artix-grub-live
    # unsquashfs: seglinux-setup applies rootfs.img with it.
    - squashfs-tools
  packages-init:
    openrc:
      - artix-live-openrc
      # artix-live's pacman-init service needs haveged.
      - haveged-openrc
    dinit:
      - artix-live-dinit
    runit:
      - artix-live-runit
    s6:
      - artix-live-s6
