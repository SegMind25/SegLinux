# SegLinux gaming defaults.
#
# Only keys every x86-64 kernel SegLinux ships has: one failing key makes
# the whole sysctl service fail at boot. The NMI watchdog, which cannot be
# switched off on every machine (virtual machines answer error 524), is
# turned off on the kernel command line instead (nowatchdog nmi_watchdog=0,
# written by SegLinux Setup).

# Some Windows games map a very large number of memory areas and crash with
# the kernel default of 65530. This is the value SteamOS uses.
vm.max_map_count = 2147483642

# Split lock detection deliberately slows down programs that perform split
# locks; several games do, and stutter badly. SteamOS turns it off too.
kernel.split_lock_mitigate = 0

# Game launchers and Steam watch many files.
fs.inotify.max_user_watches = 524288

# The kernel defragments memory in the background to make huge pages
# available; while a game allocates and frees a lot, that work shows up as
# stutter. 0 turns the background work off (the default is 20); a program
# that needs a contiguous block still gets it by compacting on demand. This is
# what SteamOS and the gaming kernels set.
vm.compaction_proactiveness = 0

# vm.swappiness is not set here on purpose. With zram swap (the default) a
# high value is right and Setup writes it (90-seglinux-zram.conf); without
# it a low one is, which `seg tune gaming` sets (10).
