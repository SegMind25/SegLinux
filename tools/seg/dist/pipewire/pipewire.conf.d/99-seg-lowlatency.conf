# Lower audio latency for games (seg game audio on): a 256-sample buffer at
# 48 kHz is about 5 ms. If sound crackles, `seg game audio off`.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 512
}
