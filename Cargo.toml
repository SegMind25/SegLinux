[workspace]
resolver = "3"
members = [
    "crates/wincraft-pe",
    "crates/wincraft-core",
    "crates/wcrun",
    "crates/wincraft-setup",
    "crates/wincraft-shell",
    "crates/wincraft-installer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Wincraft contributors"]
repository = "https://github.com/SegMind25/Wincraft"
homepage = "https://github.com/SegMind25/Wincraft"

[workspace.dependencies]
wincraft-pe = { path = "crates/wincraft-pe" }
wincraft-core = { path = "crates/wincraft-core" }
# The graphical installer only needs the library, not the text-mode wizard.
wincraft-setup = { path = "crates/wincraft-setup", default-features = false }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ratatui = "0.30"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
