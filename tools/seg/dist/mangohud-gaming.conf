# MangoHud preset for games, shipped by SegLinux. It is OFF by default: a game
# gets it only with `mangohud = true` and `mangohud_config = "preset"` in its
# ~/.config/seg/games.toml profile, or with
#   MANGOHUD_CONFIGFILE=/usr/share/seg/mangohud-gaming.conf mangohud %command%
# Your own ~/.config/MangoHud/MangoHud.conf is never touched.

legacy_layout=false
position=top-left
font_size=20
background_alpha=0.35
round_corners=6

# What to show: frame rate and frame time (with its graph), CPU and GPU load
# and temperature, memory.
fps
frametime
frame_timing
cpu_stats
cpu_temp
gpu_stats
gpu_temp
vram
ram

# Logging for benchmarks (docs/gaming.md): Shift+F2 starts and stops a log.
output_folder=/tmp
log_duration=60
autostart_log=0
toggle_logging=Shift_L+F2
log_interval=100

# Hide or show the overlay while playing.
toggle_hud=Shift_R+F12
