---
# Wincraft ISO profile for artools' buildiso (artools >= 0.39).
#
#   rootfs  -> LiveOS/rootfs.img  the system wincraft-setup installs; the
#                                 counterpart of sources\install.wim
#   livefs  -> LiveOS/livefs.img  live-session-only layer on top of rootfs;
#                                 together they are the counterpart of the
#                                 WinPE image in sources\boot.wim
#
# root-overlay/ is copied over rootfs, live-overlay/ over livefs.
# Build with iso/build.sh (see docs/building.md).

live-session:
  user: wincraft
  password: wincraft
  autologin: true
  # false selects packages-xorg from common.yaml (X11 + XWayland under
  # Plasma's Wayland session).
  use-xlibre: false
  services:
    - acpid
    - bluetoothd
    - cronie
    - cupsd
    - syslog-ng
    - NetworkManager
    - sddm
    - power-profiles-daemon
  user-services:
    - dbus
    - pipewire
    - pipewire-pulse
    - wireplumber

rootfs:
  packages:
    # Wincraft itself: wcrun, wincraft-setup, the Windows-style defaults.
    # Built from this repository into a local [wincraft] repository.
    - wincraft
    # buildiso copies the GRUB theme from rootfs.
    - artix-grub-theme

    # Desktop: KDE Plasma laid out like Windows (Windows counterpart on the right)
    - plasma-desktop               # desktop, taskbar, Start menu
    - plasma-nm                    # network flyout
    - plasma-pa                    # volume flyout
    - plasma-systemmonitor         # Task Manager
    - powerdevil                   # power options
    - bluedevil                    # Bluetooth settings
    - kscreen                      # display settings
    - kinfocenter                  # System Information
    - kde-gtk-config
    - breeze-gtk
    - kwallet-pam                  # Credential Manager
    - xdg-desktop-portal-kde
    - sddm                         # sign-in screen
    - sddm-kcm
    - print-manager                # Devices and Printers
    - discover                     # Microsoft Store
    - flatpak
    - xorg-server
    - xorg-xwayland
    - xdg-user-dirs
    - xdg-utils

    # Accessories
    - dolphin                      # File Explorer
    - konsole                      # Terminal
    - kate                         # Notepad
    - kcalc                        # Calculator
    - spectacle                    # Snipping Tool
    - gwenview                     # Photos
    - okular                       # PDF reader
    - ark                          # compressed folders
    - partitionmanager             # Disk Management
    - kio-extras                   # Network (smb://) and thumbnails
    - kio-admin                    # open folders as administrator
    - kdenetwork-filesharing       # share folders with Windows PCs
    - ffmpegthumbs
    - kdegraphics-thumbnailers
    - firefox                      # Edge
    - libreoffice-fresh            # Office
    - vlc                          # Media Player

    # Sound
    - pipewire
    - pipewire-alsa
    - pipewire-pulse
    - wireplumber
    - alsa-utils

    # Networking, printing and Windows file sharing
    - networkmanager
    - bluez
    - bluez-utils
    - cups
    - smbclient
    - cifs-utils
    - ntp
    - openssh

    # Fonts metric-compatible with Windows fonts (Arial, Times New Roman,
    # Courier New, Calibri, Cambria) so documents keep their layout
    - noto-fonts
    - noto-fonts-emoji
    - ttf-liberation
    - ttf-carlito
    - ttf-caladea

    # Running Windows programs
    - wine
    - winetricks
    - steam
    - dosbox
    - mesa
    - lib32-mesa
    - vulkan-icd-loader
    - lib32-vulkan-icd-loader
    - vulkan-radeon
    - lib32-vulkan-radeon
    - vulkan-intel
    - lib32-vulkan-intel
    - vulkan-nouveau
    - vulkan-tools

  packages-init:
    openrc:
      - pipewire-openrc
      - pipewire-pulse-openrc
      - wireplumber-openrc
      - networkmanager-openrc
      - sddm-openrc
      - cups-openrc
      - bluez-openrc
      - syslog-ng-openrc
    dinit:
      - pipewire-dinit
      - pipewire-pulse-dinit
      - wireplumber-dinit
      - userspawn-dinit
      - dbus-dinit-user
      - networkmanager-dinit
      - sddm-dinit
      - cups-dinit
      - bluez-dinit
      - syslog-ng-dinit

livefs:
  packages:
    # Live boot menu scaffolding buildiso reads from this layer.
    - artix-grub-live
    # unsquashfs: wincraft-setup applies rootfs.img with it.
    - squashfs-tools
  packages-init:
    openrc:
      - artix-live-openrc
    dinit:
      - artix-live-dinit
    runit:
      - artix-live-runit
    s6:
      - artix-live-s6
