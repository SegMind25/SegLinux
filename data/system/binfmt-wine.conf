# Installed as /etc/binfmt.d/wine.conf, which takes the place of the
# wine.conf shipped by the wine package (files in /etc override files with
# the same name in /usr/lib). Programs starting with "MZ" are started by
# segrun, so `./setup.exe` works in a terminal like it does on Windows.
:segrun:M::MZ::/usr/bin/segrun:
