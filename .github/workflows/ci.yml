name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install desktop build libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-4-dev libwayland-dev meson ninja-build xvfb xauth dbus-x11 libglib2.0-bin
          git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell --prefix=/usr -Dintrospection=false -Dvapi=false -Dsmoke-tests=false
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked -p seglinux-setup --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Rust Settings save integration
        env:
          GTK_A11Y: none
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          settings_test_dir=$(mktemp -d)
          XDG_CONFIG_HOME="$settings_test_dir" SEGLINUX_SETTINGS_TEST_ROOT="$settings_test_dir" \
            xvfb-run -a dbus-run-session -- cargo test --locked -p seglinux-shell \
              settings_apply_validates_and_preserves_game_overrides -- --ignored --test-threads=1
      - name: Rust Start menu and pins integration
        env:
          GTK_A11Y: none
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          start_test_dir=$(mktemp -d)
          XDG_CONFIG_HOME="$start_test_dir/config" XDG_DATA_HOME="$start_test_dir/data" \
            XDG_STATE_HOME="$start_test_dir/state" SEGLINUX_SETTINGS_TEST_ROOT="$start_test_dir" \
            xvfb-run -a dbus-run-session -- cargo test --locked -p seglinux-shell \
              start_menu_favorites_categories_search_and_new_applications -- --ignored --test-threads=1
      - name: Desktop services integration (notifications, tray, volume key)
        run: |
          cargo build --locked -p seglinux-shell --bin seglinux-shell --examples
          xvfb-run -a dbus-run-session -- crates/seglinux-shell/tests/desktop-services.sh
      - name: Validate the example answer file
        run: cargo run --locked -q -p seglinux-setup -- validate crates/seglinux-setup/autounattend.example.toml
      - name: Validate the default segrun configuration
        run: cargo run --locked -q -p segrun -- --config data/seglinux/segrun.toml config

  # seg (tools/seg) is a workspace of its own with its own release profile.
  seg:
    name: seg (fmt, clippy, tests, size)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/seg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/seg
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Without the test cfg, where unwrap and expect are compile errors.
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - name: Dependencies stay minimal (seg, lexopt and libc only)
        run: |
          cargo tree --locked -e normal --prefix none | sort -u
          test "$(cargo tree --locked -e normal --prefix none | sort -u | wc -l)" -le 3
      # The only unsafe code is the few libc calls of src/game/proc.rs.
      - name: unsafe stays in one file
        run: |
          test "$(grep -rEl '\bunsafe[[:space:]]*(\{|fn|impl|extern)' segctl/src)" = "segctl/src/game/proc.rs"
      # With Artix's sudo, which SegLinux ships: the runner's sudo-rs does
      # not accept wildcards in command arguments.
      - name: sudoers rule is valid
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" docker.io/artixlinux/artixlinux:base sh -ec '
            pacman-key --init >/dev/null 2>&1
            pacman-key --populate artix >/dev/null 2>&1
            pacman -Sy --noconfirm --needed sudo >/dev/null
            visudo -cf /dist/sudoers-seg-game'
      - name: Release binary size
        run: |
          cargo build --locked --release
          ls -l target/release/seg
          target/release/seg --version
          echo "seg is $(stat -c %s target/release/seg) bytes" >> "$GITHUB_STEP_SUMMARY"

  scripts:
    name: Shell scripts and profile files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -s bash iso/build.sh iso/scripts/*.sh packaging/seglinux/seglinux.install data/system/seglinux-upgrade data/system/seglinux-update \
            packaging/make-signing-key.sh crates/seglinux-shell/tests/desktop-services.sh \
            data/system/fastfetch.bashrc data/system/rust-tools.bashrc
          shellcheck -s sh data/system/apply-branding data/system/pipewire-session \
            iso/iso-profiles/seglinux/live-overlay/usr/lib/seglinux/live-autostart \
            data/desktop/seglinux-session data/desktop/seglinux-gaming-session \
            data/desktop/labwc/autostart data/system/seglinux-terminal data/system/restore-trimmed-files \
            data/system/profile-gaming.sh data/greeter/seglinux-greeter-session data/system/zram-setup \
            tools/seg/dist/fstrim-weekly tools/seg/dist/runit/*/run tools/seg/dist/runit/seg-zram/finish \
            tools/seg/dist/openrc/seg-tune tools/seg/dist/openrc/seg-zram tools/seg/dist/openrc/seg-game
          shellcheck -s bash pkg/segctl/segctl.install
          shellcheck -s bash iso/iso-profiles/seglinux-lite/live-overlay/etc/skel/.bash_profile
      - name: YAML, JSON and XML syntax
        run: |
          python3 -c 'import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' \
            iso/iso-profiles/common/common.yaml iso/iso-profiles/*/profile.yaml \
            iso/iso-profiles/seglinux-lite/common.yaml
          python3 -m json.tool data/plasma/look-and-feel/org.seglinux.desktop/metadata.json > /dev/null
          # JSON with comment lines (fastfetch's .jsonc).
          sed '/^ *\/\//d' data/fastfetch/config.jsonc | python3 -m json.tool > /dev/null
          python3 -c 'import sys, xml.dom.minidom as m; [m.parse(f) for f in sys.argv[1:]]' data/desktop/labwc/rc.xml \
            data/greeter/labwc/rc.xml data/greeter/labwc/menu.xml
      - name: Package lists have no repeats
        run: |
          python3 - <<'EOF'
          import collections, yaml
          failed = False
          for profile, common in (("seglinux", "iso/iso-profiles/common/common.yaml"),
                                  ("seglinux-lite", "iso/iso-profiles/seglinux-lite/common.yaml")):
              c = yaml.safe_load(open(common))
              p = yaml.safe_load(open(f"iso/iso-profiles/{profile}/profile.yaml"))
              xorg = "packages-xlibre" if p["live-session"].get("use-xlibre") else "packages-xorg"
              for init in ("openrc", "runit", "dinit"):
                  names = []
                  for key in ("packages-base", "packages-apps", xorg, "packages-misc"):
                      names += c.get(key) or []
                  names += (c.get("packages-init") or {}).get(init) or []
                  names += p["rootfs"]["packages"] + ((p["rootfs"].get("packages-init") or {}).get(init) or [])
                  repeats = [n for n, k in collections.Counter(names).items() if k > 1]
                  if repeats:
                      failed = True
                      print(f"{profile} ({init}): listed more than once: {', '.join(repeats)}")
          raise SystemExit(1 if failed else 0)
          EOF
      - name: udev rules
        run: udevadm verify --no-style data/system/*.rules
      - name: Overlay links resolve
        run: |
          broken=$(find iso/iso-profiles -xtype l)
          if [[ -n $broken ]]; then echo "Broken links:"; echo "$broken"; exit 1; fi
      - name: Website assembles
        run: |
          node --check site/app.js
          node --check site/preferences.js
          # The same dependencies as the Vercel build (vercel.json).
          python3 -m pip install --quiet --target /tmp/site-deps -r site/build-requirements.txt
          echo '[]' > /tmp/releases.json
          PYTHONPATH=/tmp/site-deps python3 site/build.py --out /tmp/site --releases /tmp/releases.json
          test -s /tmp/site/index.html && test -s /tmp/site/assets/logo.svg && test -s /tmp/site/docs/gaming.html
          python3 site/tests/test_download.py
      - name: Website behaviour in a browser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --silent --no-save --prefix /tmp/playwright playwright@1.56.1
          cp site/tests/releases.json /tmp/site/releases.json
          SITE_DIR=/tmp/site CHROMIUM_PATH="$(command -v google-chrome)" NODE_PATH=/tmp/playwright/node_modules \
            node site/tests/browser.cjs
      - name: Boot menu theme files exist
        run: |
          cd data/grub/seglinux
          # Every image the theme names (globs such as select_*.png must match).
          for f in $(grep -o '"[^"]*\.\(png\|jpg\)"' theme.txt | tr -d '"'); do
            compgen -G "$f" > /dev/null || { echo "missing: $f"; exit 1; }
          done
          ls *.pf2 icons/seglinux.png > /dev/null
      - name: Desktop entries
        run: |
          sudo apt-get install -y -qq desktop-file-utils > /dev/null
          desktop-file-validate data/applications/*.desktop data/desktop/*.desktop \
            iso/iso-profiles/seglinux/live-overlay/usr/share/applications/*.desktop

  packages:
    name: Artix package names (${{ matrix.profile }}, ${{ matrix.init }}, linux-zen)
    runs-on: ubuntu-latest
    container: docker.io/artixlinux/artixlinux:base
    strategy:
      fail-fast: false
      matrix:
        profile: [seglinux]
        init: [openrc, runit, dinit]
        include:
          # The Lite edition is OpenRC only.
          - profile: seglinux-lite
            init: openrc
    steps:
      - uses: actions/checkout@v4
      - name: Install pacman tooling
        run: |
          pacman-key --init
          pacman-key --populate artix
          pacman -Sy --noconfirm --needed go-yq
          iso/scripts/chaotic-aur.sh
      # -x: the packages `seg game setup` can choose (NVIDIA's driver, the
      # Vulkan drivers, the games stack) must exist and resolve on top of the image.
      - run: iso/scripts/check-packages.sh -p ${{ matrix.profile }} -i ${{ matrix.init }} -k linux-zen -x tools/seg/segctl/tests/setup-packages.txt
      - name: Packages the Lite edition downloads during Setup
        if: matrix.profile == 'seglinux-lite'
        run: iso/scripts/online-packages.sh -i openrc -k linux-zen

  # `sudo seglinux-upgrade` on a real Artix system, as on a SegLinux
  # installed from an older ISO (Chaotic-AUR, which it removes; a fresh keyring).
  update-command:
    name: sudo seglinux-upgrade (Artix)
    runs-on: ubuntu-latest
    container: docker.io/artixlinux/artixlinux:base
    steps:
      - uses: actions/checkout@v4
      - name: An older SegLinux updates itself (the one-time curl command)
        run: |
          cp data/system/seglinux-upgrade /tmp/seglinux-upgrade
          bash /tmp/seglinux-upgrade --noconfirm
          # Chaotic-AUR is gone (Brave comes from the AUR).
          if grep -q '^\[chaotic-aur\]' /etc/pacman.conf; then exit 1; fi
          # The command stays: `sudo seglinux-upgrade` from then on.
          test "$(command -v seglinux-upgrade)" = /usr/local/bin/seglinux-upgrade
          test "$(readlink /usr/local/bin/seglinux-update)" = seglinux-upgrade
          # Piped into bash it explains how to run it instead.
          if cat data/system/seglinux-upgrade | bash; then exit 1; fi
      - name: Running it again changes nothing
        run: |
          cp /etc/pacman.conf /tmp/pacman.conf.before
          seglinux-upgrade --noconfirm
          test "$(sha256sum < /tmp/pacman.conf.before)" = "$(sha256sum < /etc/pacman.conf)"
          test "$(grep -c '^\[chaotic-aur\]' /etc/pacman.conf)" = 0
      - name: SegLinux's own updates, once published
        run: |
          if grep -q '^\[seglinux\]' /etc/pacman.conf; then
            pacman -Si seglinux | grep -E '^(Name|Version)'
            # Downloads the package and checks its signature.
            pacman -Sw --noconfirm seglinux
          else
            echo "::notice::No SegLinux update is published yet (the SEGLINUX_SIGNING_KEY secret is missing, docs/updating.md)"
          fi
      - name: The seglinux package's command replaces the downloaded one
        run: |
          printf '#!/bin/sh\n' > /usr/bin/seglinux-upgrade
          bash -c 'source data/system/seglinux-upgrade && retire_local_copy'
          test ! -e /usr/local/bin/seglinux-upgrade && test ! -e /usr/local/bin/seglinux-update
          rm /usr/bin/seglinux-upgrade
      - name: An SDDM system is offered the new sign-in screen
        run: |
          # dinit (this container's init) with SDDM enabled and the greeter
          # installed, as after the seglinux package has been updated.
          mkdir -p /etc/dinit.d/boot.d /var/lib/sddm /etc/sddm.conf.d /usr/share/seglinux/greeter
          touch /etc/dinit.d/sddm && ln -sfn ../sddm /etc/dinit.d/boot.d/sddm
          printf '[Last]\nUser=alice\n' > /var/lib/sddm/state.conf
          printf '[Autologin]\nUser=alice\nSession=seglinux.desktop\n' > /etc/sddm.conf.d/20-seglinux-autologin.conf
          printf '#!/bin/sh\n' > /usr/bin/seglinux-greeter && chmod 755 /usr/bin/seglinux-greeter
          cp data/greeter/greetd.toml /usr/share/seglinux/greeter/greetd.toml
          printf 'source data/system/seglinux-upgrade\noffered=/tmp/offered\noffer_sign_in_screen\n' > /tmp/offer.sh
          # Answers "y" on a terminal, as a person would (script needs libutempter).
          pacman -S --noconfirm --needed libutempter > /dev/null
          echo y | script -qec "bash /tmp/offer.sh" /dev/null
          pacman -Q greetd greetd-dinit
          test -L /etc/dinit.d/boot.d/greetd && test ! -e /etc/dinit.d/boot.d/sddm
          grep -q '^command = "seglinux-greeter-session"' /etc/greetd/config.toml
          # SDDM signed alice in automatically; the sign-in screen does not.
          if grep -q '^\[initial_session\]' /etc/greetd/config.toml; then exit 1; fi
          test "$(stat -c %U /var/lib/seglinux-greeter/state.toml)" = greeter
          grep -q 'user = "alice"' /var/lib/seglinux-greeter/state.toml
      - name: Terminals open with fastfetch and SegLinux's logo
        run: |
          pacman -S --noconfirm --needed fastfetch libutempter > /dev/null
          install -Dm644 data/fastfetch/config.jsonc /etc/xdg/fastfetch/config.jsonc
          install -Dm644 data/fastfetch/logo.txt /usr/share/seglinux/fastfetch/logo.txt
          install -Dm644 data/system/fastfetch.bashrc /etc/bash/bashrc.d/seglinux-fastfetch.bashrc
          # An interactive shell on a terminal, as kitty starts it: the logo
          # (its top row) and the information.
          TERM=xterm-256color script -qec 'bash -i -c true' /dev/null > /tmp/terminal.txt
          grep -q '▄▄███████▄▄' /tmp/terminal.txt
          grep -q 'Kernel' /tmp/terminal.txt
          # A shell started from that shell does not repeat it.
          TERM=xterm-256color script -qec "bash -c 'bash -i -c true; true'" /dev/null > /tmp/nested.txt
          if grep -q '███' /tmp/nested.txt; then exit 1; fi
      - name: SegLinux itself, built from source while its packages are not published
        run: |
          # As `sudo seglinux-upgrade` does from an account, here from this
          # commit's source instead of GitHub's newest.
          useradd -m tester
          # Stand-ins the steps above put in place by hand: the package's own
          # files on a real SegLinux.
          rm -f /usr/bin/seglinux-greeter /usr/share/seglinux/greeter/greetd.toml \
            /usr/share/seglinux/fastfetch/logo.txt
          SUDO_USER=tester SEGLINUX_SOURCE="$PWD" SEGLINUX_VERSION=0.1.0.999999 \
            bash data/system/seglinux-upgrade --noconfirm
          pacman -Q seglinux | grep -q ' 0\.1\.0\.999999-'
          # seg (package segctl) comes with it, with its group, sudoers rule
          # and services (pacman -U ran the package's install script).
          pacman -Q segctl
          seg --version
          getent group gamemode
          test "$(stat -c %a /etc/sudoers.d/seg-game)" = 440
          visudo -cf /etc/sudoers.d/seg-game
          test -x /etc/init.d/seg-game && test -f /etc/runit/sv/seg-game/run && test -f /etc/dinit.d/seg-game
          ls /etc/dinit.d/boot.d /etc/runlevels/default 2>/dev/null | grep -E '^seg-' || true
          # seg game works on a machine with no GPU: it reports, it does not crash.
          seg game check > /tmp/game-check.txt || test $? -eq 1
          grep -q 'max_map_count' /tmp/game-check.txt
          seg game run --dry-run -- true
          test -x /usr/bin/seglinux-upgrade && test -L /usr/bin/seglinux-update
          test ! -e /usr/local/bin/seglinux-upgrade
          seglinux-shell --version
          # Nothing newer: no second build.
          SUDO_USER=tester SEGLINUX_SOURCE="$PWD" SEGLINUX_VERSION=0.1.0.999999 \
            seglinux-upgrade --noconfirm | tee /tmp/again.txt
          grep -q 'is the newest' /tmp/again.txt
