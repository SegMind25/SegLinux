# esync (Wine-staging, Proton) keeps one file descriptor per Windows
# synchronisation object. Raise the hard limit; Wine raises its own soft
# limit up to it. 1048576 is the most the kernel allows (fs.nr_open) and what
# Steam Deck-class setups use, for games with very many objects.
*    hard    nofile    1048576

# seg game run raises the game's CPU priority above normal (nice -4). Normal
# users may not, unless a limit says so: members of the gamemode group, which
# SegLinux Setup puts every user in, may go down to -10.
@gamemode    -    nice    -10
