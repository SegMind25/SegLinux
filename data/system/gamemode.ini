; SegLinux defaults for GameMode (segrun runs games under gamemoderun).
; Copy to ~/.config/gamemode.ini to change them for one user.

[general]
; CPU governor while a game runs.
desiredgov=performance

; Integrated GPUs (Intel, AMD APUs) share one power budget with the CPU.
; When the iGPU is the busy part, GameMode lowers the CPU governor so the
; GPU can clock higher: usually more frames on laptops and low-end PCs.
igpu_desiredgov=powersave
igpu_power_threshold=0.3

; Higher CPU priority for the game (needs the gamemode group, which SegLinux
; Setup gives every user) and the best I/O priority.
renice=10
ioprio=0

softrealtime=auto
inhibit_screensaver=1
disable_splitlock=1
