name: ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition (lite is OpenRC only)
        type: choice
        options: [full, lite]
        default: full
      init:
        description: Init system
        type: choice
        options: [openrc, runit, dinit]
        default: openrc
      kernel:
        description: Kernel
        type: choice
        options: [linux-zen, linux, linux-lts]
        default: linux-zen
      release:
        description: Publish the ISO as a GitHub release
        type: boolean
        default: true
  # Version tags (both editions), and any push to main whose commit message
  # contains "[build iso]" (full edition) and/or "[build lite iso]" (Lite).
  push:
    tags: ["v*"]
    branches: [main]

permissions:
  contents: write

jobs:
  iso:
    name: Build the SegLinux ISO (${{ matrix.edition }}, ${{ matrix.edition == 'lite' && 'openrc' || inputs.init || 'openrc' }}, ${{ inputs.kernel || 'linux-zen' }})
    if: >-
      github.event_name != 'push' || github.ref_type == 'tag' ||
      contains(github.event.head_commit.message, '[build iso]') ||
      contains(github.event.head_commit.message, '[build lite iso]')
    runs-on: ubuntu-latest
    # A full build takes about an hour; a hang should not burn four.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.edition) || github.ref_type == 'tag' && '["full","lite"]' || contains(github.event.head_commit.message, '[build lite iso]') && (contains(github.event.head_commit.message, '[build iso]') && '["full","lite"]' || '["lite"]') || '["full"]') }}
    env:
      EDITION: ${{ matrix.edition }}
      # The Lite edition is OpenRC only.
      INIT: ${{ matrix.edition == 'lite' && 'openrc' || inputs.init || 'openrc' }}
      KERNEL: ${{ inputs.kernel || 'linux-zen' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The seglinux package's version counts the commits (0.1.0.<count>),
          # so every update is newer than the one before.
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af > /dev/null
          df -h /
      - name: Load the loop module
        run: sudo modprobe loop
      # SegLinux's updates are signed with the SEGLINUX_SIGNING_KEY secret
      # (docs/updating.md). Its public half goes into the seglinux package,
      # so installed systems trust what this key signs.
      - name: Prepare the update signing key
        env:
          SEGLINUX_SIGNING_KEY: ${{ secrets.SEGLINUX_SIGNING_KEY }}
        run: |
          if [[ -z $SEGLINUX_SIGNING_KEY ]]; then
            echo "::notice::No SEGLINUX_SIGNING_KEY secret: this build publishes no SegLinux update (docs/updating.md)."
            exit 0
          fi
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$SEGLINUX_SIGNING_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          [[ -n $fpr ]] || { echo "::error::SEGLINUX_SIGNING_KEY holds no secret key"; exit 1; }
          mkdir -p data/keyrings
          gpg --batch --armor --export "$fpr" > data/keyrings/seglinux.gpg
          printf '%s:4:\n' "$fpr" > data/keyrings/seglinux-trusted
          : > data/keyrings/seglinux-revoked
          echo "SEGLINUX_SIGNING_FPR=$fpr" >> "$GITHUB_ENV"
          echo "Updates are signed with $fpr"
      - name: Build
        run: |
          edition=()
          [[ $EDITION == lite ]] && edition=(--lite)
          SEGLINUX_PKGVER="0.1.0.$(git rev-list --count HEAD)" \
            ./iso/build.sh "${edition[@]}" -e docker -i "$INIT" -k "$KERNEL"
      - name: Show the result
        run: ls -l iso/out/ iso/out/packages/ && cat iso/out/*.sha256
      # The seglinux package, signed, in the repository installed systems
      # update from (the release "packages"; seglinux-update). Published by
      # one job only, and before the ISO: an image never names an update
      # that is not there.
      - name: Publish the SegLinux update
        if: (github.event_name == 'push' || inputs.release) && env.SEGLINUX_SIGNING_FPR != '' && (matrix.edition == 'full' || strategy.job-total == 1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          cd iso/out/packages
          pkg=$(ls seglinux-*.pkg.tar.zst)
          gpg --batch --yes --local-user "$SEGLINUX_SIGNING_FPR" --detach-sign --output "$pkg.sig" "$pkg"
          gpg --batch --verify "$pkg.sig" "$pkg"
          cp ../../../data/keyrings/seglinux.gpg .
          # repo-add (pacman) writes the database, with the signature in it.
          docker run --rm -v "$PWD:/repo" -w /repo docker.io/artixlinux/artixlinux:base-devel \
            repo-add seglinux.db.tar.gz "$pkg"
          sudo chown -R "$(id -u):$(id -g)" .
          cp -L seglinux.db.tar.gz seglinux.db.upload && mv seglinux.db.upload seglinux.db
          cp -L seglinux.files.tar.gz seglinux.files.upload && mv seglinux.files.upload seglinux.files
          tag=packages
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "SegLinux updates" \
              --notes "The package repository installed SegLinux systems update from: run \`sudo seglinux-update\` (docs/updating.md). Not an ISO."
          fi
          # The package first, then the database that names it; then the
          # old versions go (pacman only fetches what the database names).
          gh release upload "$tag" "$pkg" "$pkg.sig" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$tag" seglinux.db seglinux.files seglinux.gpg --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            { grep -E '^seglinux-.*\.pkg\.tar\.zst(\.sig)?$' || true; } | grep -vxF -e "$pkg" -e "$pkg.sig" |
            while read -r old; do gh release delete-asset "$tag" "$old" --repo "$GITHUB_REPOSITORY" --yes; done
          echo "Published $pkg"
      # Workflow artifacts would exceed the Actions storage quota of private
      # repositories, so the ISO is published as a release. Release assets
      # are limited to 2 GiB each: larger images are split into parts.
      - name: Publish as a release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd iso/out
          iso=$(ls seglinux-*.iso)
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            tag=$GITHUB_REF_NAME
          else
            tag="iso-$(date -u +%Y%m%d)-$EDITION-$INIT-$KERNEL-run$GITHUB_RUN_NUMBER"
          fi
          title="SegLinux $tag"
          [[ $EDITION == lite ]] && title="SegLinux Lite $tag"
          size=$(stat -c %s "$iso")
          assets=("$iso.sha256")
          if (( size > 2000000000 )); then
            split -b 1900M -d -a 2 "$iso" "$iso.part"
            rm "$iso"
            assets+=("$iso".part*)
            get="cat $iso.part* > $iso"
          else
            assets+=("$iso")
            get="(single file)"
          fi
          cat > notes.md <<EOF
          SegLinux live/installer ISO, $EDITION edition, built from $GITHUB_SHA ($INIT, $KERNEL).
          Size: $(numfmt --to=iec --suffix=B "$size") ($size bytes).

          Download every asset, then:

          \`\`\`sh
          $get
          sha256sum -c $iso.sha256
          \`\`\`

          Write it to a USB stick with \`sudo dd if=$iso of=/dev/sdX bs=4M status=progress oflag=sync\`
          (or Ventoy), disable Secure Boot and boot from it. See docs/building.md.
          EOF
          # A version tag builds both editions into one release.
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$title" --notes-file notes.md --prerelease ||
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
      # The website (Vercel) lists the releases when it is built: ask it to
      # build again. Add the project's deploy hook URL as the repository
      # secret VERCEL_DEPLOY_HOOK (see README, "Website").
      - name: Update the website
        if: github.event_name == 'push' || inputs.release
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [[ -z $VERCEL_DEPLOY_HOOK ]]; then
            echo "No VERCEL_DEPLOY_HOOK secret: the website shows the new image after its next deployment."
          else
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
            echo "Website deployment requested."
          fi
