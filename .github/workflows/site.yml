# The website (site/): assembled with the list of ISO images from this
# repository's releases and published on GitHub Pages, at
# https://<owner>.github.io/<repository>/. It runs when the site changes,
# after every published ISO (the ISO workflow calls it) and by hand.
#
# Turn GitHub Pages on once: Settings → Pages → Source: "GitHub Actions".
# Until then the jobs are skipped.
name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - data/artwork/seglinux.svg
      - .github/workflows/site.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Assemble the website
    if: github.event.repository.has_pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pages, screenshots and the list of ISO images
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 site/build.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
